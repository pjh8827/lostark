<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>사사게 오버레이</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: rgba(8, 8, 18, 0.90);
      color: #e0e0e0;
      width: 290px;
      min-height: 50px;
      overflow: hidden;
      user-select: none;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
    }

    /* 헤더 (드래그 핸들) */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      background: rgba(0, 0, 0, 0.55);
      border-bottom: 1px solid #1a1a2a;
      cursor: grab;
    }
    .header:active { cursor: grabbing; }
    .title { color: #f0c040; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
    .close-btn {
      background: none; border: none; color: #555;
      cursor: pointer; font-size: 13px; line-height: 1;
      padding: 0 2px;
      transition: color 0.15s;
    }
    .close-btn:hover { color: #ff4444; }

    /* 상태바 */
    .status-bar {
      padding: 2px 10px;
      background: rgba(0,0,0,0.3);
      font-size: 10px;
      color: #444;
      border-bottom: 1px solid #111;
    }
    .status-bar.active { color: #f0c040; }

    /* 결과 목록 */
    #results { padding: 4px 5px; }

    .empty {
      padding: 12px;
      text-align: center;
      color: #333;
      font-size: 11px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      margin: 2px 0;
      border-radius: 5px;
      font-size: 12px;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .pass { background: rgba(20, 60, 35, 0.85); border-left: 3px solid #44dd88; }
    .fail { background: rgba(70, 15, 15, 0.85); border-left: 3px solid #ff4455; }
    .err  { background: rgba(60, 45, 0,  0.85); border-left: 3px solid #ffaa33; }

    .icon { font-size: 13px; min-width: 14px; }
    .nick { flex: 1; font-weight: bold; font-size: 13px; }
    .pass .nick { color: #44dd88; }
    .fail .nick { color: #ff4455; }
    .err  .nick { color: #ffaa33; }

    .label { font-size: 10px; white-space: nowrap; }
    .pass .label { color: #2a9a5a; }
    .fail .label { color: #cc3344; }
    .err  .label { color: #cc8822; }

    .ts { font-size: 9px; color: #333; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header" id="drag">
    <span class="title">⚔ 사사게 오버레이</span>
    <button class="close-btn" onclick="window.close()">✕</button>
  </div>
  <div class="status-bar" id="status">연결 대기 중...</div>
  <div id="results">
    <div class="empty" id="empty">모니터링을 시작하면 결과가 표시됩니다.</div>
  </div>

  <script>
    const MAX = 8;
    const KEEP_MS = 15000;
    let count = 0;

    const resultsEl = document.getElementById('results');
    const emptyEl   = document.getElementById('empty');
    const statusEl  = document.getElementById('status');

    // BroadcastChannel로 메인 창과 통신
    const ch = new BroadcastChannel('inven-overlay');

    ch.onmessage = (e) => {
      const msg = e.data;
      if      (msg.type === 'result') addResult(msg);
      else if (msg.type === 'status') setStatus(msg.text, msg.active);
      else if (msg.type === 'clear')  clearAll();
      else if (msg.type === 'ping')   ch.postMessage({ type: 'pong' });
    };

    function setStatus(text, active) {
      statusEl.textContent = text;
      statusEl.className = 'status-bar' + (active ? ' active' : '');
    }

    function addResult(r) {
      emptyEl.style.display = 'none';

      let cls = 'result-item ';
      let icon, label;
      if (r.error) {
        cls += 'err'; icon = '\u26a0'; label = 'ERROR';
      } else if (r.found) {
        cls += 'fail'; icon = '\u2717'; label = 'FAIL (' + r.count + '\uac74)';
      } else {
        cls += 'pass'; icon = '\u2713'; label = 'PASS';
      }

      const div = document.createElement('div');
      div.className = cls;
      div.innerHTML =
        '<span class="icon">' + icon + '</span>' +
        '<span class="nick">' + esc(r.nickname) + '</span>' +
        '<span class="label">' + label + '</span>' +
        '<span class="ts">' + r.time + '</span>';

      // 새 결과를 맨 위에 삽입
      const firstResult = resultsEl.querySelector('.result-item');
      if (firstResult) resultsEl.insertBefore(div, firstResult);
      else resultsEl.appendChild(div);
      count++;

      // 최대 개수 초과 시 가장 오래된 항목 제거
      const items = resultsEl.querySelectorAll('.result-item');
      if (items.length > MAX) { items[items.length - 1].remove(); count--; }

      // N초 후 자동 제거
      setTimeout(() => {
        div.remove(); count--;
        if (count <= 0) { count = 0; emptyEl.style.display = ''; }
      }, KEEP_MS);
    }

    function clearAll() {
      resultsEl.querySelectorAll('.result-item').forEach(el => el.remove());
      count = 0;
      emptyEl.style.display = '';
      setStatus('\uc644\ub8cc \ucd08\uae30\ud654', false);
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 메인 창에서 ping이 오면 살아있다고 응답
    ch.postMessage({ type: 'pong' });
  </script>
</body>
</html>
